events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=reports_cache:10m max_size=1g inactive=24h use_temp_path=off;

    upstream minio {
        server minio:9000;
    }

    server {
        listen 80;

        # CDN endpoint для отчетов
        location /reports/ {
            proxy_cache reports_cache;
            proxy_cache_valid 200 12h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            # Ключ кэширования включает путь и параметры запроса
            proxy_cache_key "$scheme$request_method$host$request_uri";

            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=43200"; # 12 часов

            proxy_pass http://minio/;
            proxy_set_header Host $host;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}